name: website CI

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.2
      - name: Format
        run: crystal tool format --check

  specs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LUCKY_ENV: test
      DB_HOST: localhost
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
       # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.20.2
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Crystal cache
        uses: actions/cache@v5
        id: crystal-cache
        with:
          path: |
            ~/.cache/crystal
            lib
          key: ${{ runner.os }}-crystal-${{ hashFiles('**/shard.lock') }}
          restore-keys: |
            ${{ runner.os }}-crystal-

      - name: Install shards
        run: shards check || shards install

      - name: Install frontend packages
        run: bun ci
      - name: Compiling assets
        run: bun run prod
      - name: Build lucky_tasks
        run: crystal build tasks.cr -o ./lucky_tasks

      - name: Prepare database
        run: |
          ./lucky_tasks db.create
          ./lucky_tasks db.migrate
          ./lucky_tasks db.seed.required_data

      - name: Run tests
        run: crystal spec
