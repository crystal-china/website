  docs:
    setup_page:
      page_title: Documentation setup
      heading: Set up your documentation
      introduction: Documentation files live outside the application binary. Create the files below manually, or let an administrator generate the starter files.
      working_directory: Paths are relative to the server's working directory, not the binary's location. For example, if you start ./bin/crystal_china from the project root, use public/markdowns/ inside that root.
      missing_files: Missing files
      generate: Generate starter files
      never_overwrite: Only missing files are created. Existing files, including an empty navigation.yml, are never overwritten.
      admin_help: Automatic generation is available to administrators only. Configure ADMIN_EMAILS in the server environment and sign in with a listed account. You can also create the files manually.
      navigation_heading: 1. Create navigation.yml
      navigation_help: This YAML file is a list of pages. Each entry needs a path and a title. The path is a /docs/ URL without the .md extension. List order controls the previous/next page links; children can be used to group pages in the sidebar.
      empty_navigation: 'An empty file or [] is also valid: documents remain accessible, but have no sidebar or previous/next page links. Titles can then come from the Markdown front matter.'
      index_heading: 2. Create index.md
      index_help: This is the documentation home page at /docs/index. The optional YAML front matter between --- lines defines its title and subtitle. Everything after it is Markdown. When a page is in navigation.yml, that file's title takes precedence.
      more_heading: 3. Add more documents
      more_help: 'For example, create public/markdowns/guide.md to publish /docs/guide. Subdirectories work too: public/markdowns/install/linux.md is available at /docs/install/linux.'
      sidebar_help: 'To add a page to the sidebar and pager, append an entry to navigation.yml:'
      unlisted_help: A Markdown file not listed in navigation.yml is still directly accessible and searchable. A navigation entry alone does not create its Markdown file.
      apply_heading: 4. Apply changes
      refresh_help: After creating or editing these files, refresh the document page. No application rebuild or restart is required. For a remote deployment, synchronize public/markdowns/ to the server first.
      search_help: Viewing a document syncs its content into the database for search. To sync all documents at once, run bin/tasks db.sync_doc_content from the project root with the site's database configuration.

