  docs:
    setup_page:
      page_title: 文档初始化
      heading: 创建文档入口
      introduction: 文档文件独立于程序二进制。你可以手动创建下面的文件，也可以由管理员一键生成初始文件。
      working_directory: 路径相对于服务器的工作目录，而非二进制文件所在目录。例如从项目根目录运行 ./bin/crystal_china，文档目录就是该根目录下的 public/markdowns/。
      missing_files: 缺少的文件
      generate: 生成初始文件
      never_overwrite: 只创建缺少的文件，不覆盖任何已有文件，包括空的 navigation.yml。
      admin_help: 只有管理员可以自动生成文件。请在服务器环境变量 ADMIN_EMAILS 中配置管理员邮箱，并使用该账号登录；你也可以手动创建文件。
      navigation_heading: 1. 创建 navigation.yml
      navigation_help: 这个 YAML 文件保存页面列表，每项需要 path 和 title。path 是不含 .md 扩展名的 /docs/ 地址。列表顺序决定上一页和下一页，children 用来组织侧栏中的子页面。
      empty_navigation: 空文件或 [] 也合法：文档仍可访问，但不显示侧栏和上一页、下一页。此时标题可来自 Markdown 的 YAML front matter。
      index_heading: 2. 创建 index.md
      index_help: 这是 /docs/index 的文档首页。文件开头两行 --- 之间的可选 YAML front matter 定义标题和副标题，其余部分为 Markdown。页面列在 navigation.yml 中时，该配置中的标题优先。
      more_heading: 3. 添加更多文档
      more_help: 例如创建 public/markdowns/guide.md 即可访问 /docs/guide；也支持子目录：public/markdowns/install/linux.md 对应 /docs/install/linux。
      sidebar_help: 要将页面加入侧栏和分页导航，在 navigation.yml 中追加一项：
      unlisted_help: 未列在 navigation.yml 中的 Markdown 文件仍可直接访问和搜索。仅增加导航配置不会自动创建 Markdown 文件。
      apply_heading: 4. 应用改动
      refresh_help: 创建或修改文件后刷新文档页面即可，无须重新编译或重启程序。远程部署时，先将 public/markdowns/ 同步到服务器。
      search_help: 访问文档时，内容会同步到数据库供搜索使用。要一次同步全部文档，请在项目根目录下，使用该站点的数据库配置运行 bin/tasks db.sync_doc_content。

