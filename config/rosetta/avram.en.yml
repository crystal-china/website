  avram:
    validate_acceptance_of: must be accepted
    validate_at_most_one_filled: must be blank
    validate_confirmation_of: must match
    validate_exact_size_of: must be exactly %{size} characters long
    validate_exactly_one_filled: at least one must be filled
    validate_format_of: is invalid
    validate_inclusion_of: is not included in the list
    validate_max_size_of: must not have more than %{size} characters
    validate_min_size_of: must have at least %{size} characters
    validate_numeric_max: must be no more than %{size}
    validate_numeric_min: must be at least %{size}
    validate_numeric_nil: must not be nil
    validate_required: is required
    validate_uniqueness_of: is already taken
    attribute_variants: *fields
    error: "%{field} %{message}"
    validate_url_format: must be a valid URL beginning with %{scheme}

  validations:
    admin_required: requires administrator privileges
    login_name_change_expired: can only be changed within 7 days of registration
    login_name_format: must start with an English letter, number or underscore, end with a letter or number, and use only letters, numbers or non-adjacent separators (_, - and .)
    avatar_url: must be a valid http/https URL
    email_not_registered: must be a valid registered email address
    credentials_incorrect: are incorrect; check your email, username or password
    comment_target_conflict: must not specify both a comment thread and a parent comment
