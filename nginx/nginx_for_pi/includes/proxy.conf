# cloudflared 通过 127.0.0.1 连接 Nginx；只信任这个本地代理提供的客户端 IP。
set_real_ip_from         127.0.0.1;
real_ip_header          CF-Connecting-IP;

# 使用原始连接地址判断来源，仅保留本地代理传来的合法协议值。
map "$realip_remote_addr:$http_x_forwarded_proto" $client_forwarded_proto {
    default             $scheme;
    "127.0.0.1:http"    http;
    "127.0.0.1:https"   https;
}

proxy_set_header        Host $http_host;
proxy_set_header        X-Real-IP $remote_addr;
# Lucky 读取最后一个地址；直接传递已校正的 IP，不追加本地代理地址。
proxy_set_header        X-Forwarded-For $remote_addr;
proxy_set_header        X-Forwarded-Proto $client_forwarded_proto;
proxy_ssl_session_reuse on;
proxy_buffering         on;
proxy_buffers           32 16k;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
proxy_set_header        Upgrade $http_upgrade;
proxy_set_header        Connection $connection_upgrade;
