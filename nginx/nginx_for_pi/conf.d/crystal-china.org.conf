upstream crystal-china.org {
    server 127.0.0.1:5000;
}

server {
    server_name crystal-china.org;

    listen 80 default_server;
    listen [::]:80 default_server;

    # nginx 默认值是 1M, 如果不上传图片，肯定是够大的。
    client_max_body_size 5M;

    root /home/pi/apps/crystal_china_production/public;

    include includes/security_file_access.conf;

    location / {
        proxy_pass http://crystal-china.org;
    }

    location ~ ^/(assets|packs) {
        include includes/assets.conf;
    }
}

server {
    server_name myblog.crystal-china.org;

    client_max_body_size 5M;

    include includes/security_file_access.conf;

    location / {
        proxy_pass http://127.0.0.1:5001;
    }
}

 server {
     server_name assets.crystal-china.org;
     root /home/pi/apps/crystal_china_production/public;

     location ~* \.(md|ya?ml)$ {
         return 410;
     }

     location /myblog/assets/ {
         alias /home/pi/apps/myblog_production/public/assets/;
     }

     include includes/assets.conf;
 }

server {
    server_name upload.crystal-china.org;
    root /home/pi/apps/patchy/data;
}

